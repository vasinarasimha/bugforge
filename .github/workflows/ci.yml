name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend CI (Tests & Migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bugforge_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://ci_user:ci_password@localhost:5432/bugforge_ci
      JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production-12345
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: test
      APP_NAME: BugForge API
      GROQ_API_KEY: dummy-groq-key-for-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Cache HuggingFace Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify and enable pgvector extension
        run: |
          PGPASSWORD=ci_password psql -h localhost -U ci_user -d bugforge_ci -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Diagnose Alembic migration graph and git commit
        working-directory: backend
        run: |
          echo "=== 1. Current Git commit ==="
          git rev-parse HEAD
          echo "=== 2. Alembic heads ==="
          python -m alembic heads
          echo "=== 3. Alembic branches ==="
          python -m alembic branches
          echo "=== 4. Alembic history ==="
          python -m alembic history --verbose
          echo "=== 5. List migration files ==="
          ls -la alembic/versions/
          echo "=== 6. Confirm specific files exist ==="
          ls -l alembic/versions/6c1e95e02210_merge_multiple_heads.py
          ls -l alembic/versions/1ab9eeb7bf93_add_root_cause_and_resolution_to_issues.py

      - name: Run Alembic database migrations
        working-directory: backend
        run: |
          alembic upgrade head

      - name: Run backend automated tests
        working-directory: backend
        run: |
          python -m pytest -v

  frontend:
    name: Frontend CI (Build & Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm run build
